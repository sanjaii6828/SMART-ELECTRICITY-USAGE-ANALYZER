<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Added Successfully | Smart Electricity Usage Analyzer</title>

    <meta http-equiv="refresh" content="2;url=/">

    <!-- Theme Initialization Script -->
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            const savedTheme = localStorage.getItem("app-theme") ||
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .success-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: fadeInScale 0.3s ease-out;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .check-icon-circle {
            width: 72px;
            height: 72px;
            background: var(--success-light);
            color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
            border: 2px solid rgba(16, 185, 129, 0.3);
        }

        .success-card h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .success-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <div class="container success-wrapper">
        <div class="success-card">
            <div class="check-icon-circle">✓</div>
            <h1>Reading Saved Successfully!</h1>
            <p>Dataset updated and machine learning models recalibrated. Redirecting to your dashboard in 2 seconds...</p>
            <a href="/" class="btn-primary" style="display: inline-flex; justify-content: center;">
                <span>Return to Dashboard Now</span>
                <span>➔</span>
            </a>
        </div>
    </div>
</body>

</html>
